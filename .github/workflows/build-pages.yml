name: 构建下载页数据

# 任何 Release 发生变化（发布/编辑/删除）时自动重建下载页数据，也可手动触发
on:
  release:
    types: [published, edited, deleted, released, prereleased, unpublished]
  workflow_dispatch:

permissions:
  contents: write

# 同一时间只保留最新一次运行，避免连发时互相覆盖
concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 docs/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-data.js

      - name: 有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "下载页数据无变化，跳过提交。"
          else
            git commit -m "自动更新下载页数据 [skip ci]"
            git push
          fi
