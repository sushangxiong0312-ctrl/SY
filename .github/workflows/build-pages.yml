name: 构建下载页数据

# 任何 Release 变化时重建下载页数据并推到 docs/，GitHub Pages 从分支自动部署
on:
  release:
    types: [published, edited, deleted, released, prereleased, unpublished]
  workflow_dispatch:

permissions:
  contents: write

# 连发时只跑最新一次，避免并发
concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 docs/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-data.js

      - name: 有变化则提交并推送（带 rebase 重试防撞车）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --staged --quiet; then
            echo "下载页数据无变化，跳过。"
            exit 0
          fi
          git commit -m "自动更新下载页数据 [skip ci]"
          for n in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "已推送。"
              exit 0
            fi
            echo "推送冲突，重试 $n …"
            sleep 3
          done
          echo "推送多次失败"
          exit 1
