name: 构建并部署下载页

# 任何 Release 变化（发布/编辑/删除）时自动重建并部署下载页，也可手动触发
on:
  release:
    types: [published, edited, deleted, released, prereleased, unpublished]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 部署串行进行，避免互相覆盖；不取消进行中的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成 docs/data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-data.js

      - uses: actions/configure-pages@v5

      - name: 打包 docs 目录为 Pages 制品
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
