<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>软件下载</title>
<style>
:root{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Segoe UI,sans-serif;
  background:#0f1115;color:#e8eaed;display:flex;justify-content:center;padding:28px 14px 60px}
.wrap{width:100%;max-width:780px}
header{margin-bottom:22px}
h1{font-size:24px;margin:0 0 4px}
.subtitle{color:#8b95a5;font-size:14px;margin:0}
.repo{color:#6b7480;font-size:12px;margin-top:6px}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tab{cursor:pointer;font-size:14.5px;font-weight:600;color:#aab2c0;background:#171a21;border:1px solid #262b36;
  border-radius:10px;padding:8px 18px;user-select:none}
.tab:hover{color:#cdd3dd}
.tab.active{background:#1a2c44;color:#9cc0ff;border-color:#2c4a74}
.more-btn{display:block;width:100%;cursor:pointer;font-size:14px;font-weight:600;color:#9cc0ff;
  background:#171a21;border:1px dashed #2c3a55;border-radius:12px;padding:12px;margin:2px 0 16px}
.more-btn:hover{background:#1a2230;border-color:#3a5588}
.ver{background:#171a21;border:1px solid #262b36;border-radius:14px;padding:18px 20px;margin-bottom:16px}
.ver-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver-num{font-size:19px;font-weight:700}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.latest{background:#16301f;color:#7ee2a8;border:1px solid #235138}
.badge.pre{background:#33270f;color:#e7c27e;border:1px solid #5a4423}
.ver-date{color:#8b95a5;font-size:13px;margin-left:auto}
.changelog{margin:12px 0 4px;color:#c7ccd4;font-size:14.5px}
.changelog h2,.changelog h3{font-size:15px;margin:14px 0 6px;color:#e8eaed}
.changelog ul{margin:8px 0;padding-left:22px}
.changelog li{margin:3px 0}
.changelog code{background:#0f1115;border:1px solid #2c3340;border-radius:5px;padding:1px 6px;font-size:12.5px;word-break:break-all}
.changelog hr{border:0;border-top:1px solid #262b36;margin:14px 0}
.changelog a{color:#6ea8fe}
details.cat{margin-top:14px}
details.cat>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  font-size:13.5px;font-weight:700;color:#aab2c0;padding:5px 0}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary::before{content:'▸';color:#6b7480;font-weight:400;transition:transform .15s}
details.cat[open]>summary::before{transform:rotate(90deg)}
.cat-count{color:#6b7480;font-weight:500;font-size:12px}
.cat-all{cursor:pointer;font-size:12px;font-weight:600;color:#9cc0ff;background:#1a2030;border:1px solid #2c3a55;
  border-radius:7px;padding:4px 10px;margin-left:auto}
.cat-all:hover{background:#212a3e}
.cat-files{padding-top:2px}
details.cat.bundle{background:#13251a;border:1px solid #235138;border-radius:12px;padding:10px 14px}
details.cat.bundle>summary{color:#9be7b4}
.file{border-top:1px solid #262b36;padding:12px 0 4px;margin-top:8px}
details.cat.bundle .file{border-top-color:#235138}
.file:first-of-type{border-top:0}
.file-name{font-weight:600;word-break:break-all}
.file-meta{color:#8b95a5;font-size:13px;margin:2px 0 10px}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:600;
  padding:9px 16px;border-radius:9px;border:1px solid transparent;cursor:pointer}
.btn-main{background:#3b82f6;color:#fff}
.btn-main:hover{background:#2f6fe0}
details.accel{display:inline-block}
details.accel summary{list-style:none;cursor:pointer;background:#1f2430;color:#cdd3dd;border:1px solid #2c3340;
  padding:9px 14px;border-radius:9px;font-size:14px;font-weight:600}
details.accel summary::-webkit-details-marker{display:none}
.accel-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn-accel{background:#1a2030;color:#9cc0ff;border:1px solid #2c3a55;font-weight:500;font-size:13px;padding:7px 13px}
.btn-accel:hover{background:#212a3e}
.empty,.error{text-align:center;color:#8b95a5;padding:50px 0}
.error{color:#ffb4b4}
footer{margin-top:34px;text-align:center;color:#5c6472;font-size:12px}
@media(max-width:480px){h1{font-size:21px}.ver{padding:16px}}
.gate{position:fixed;inset:0;background:#0f1115;display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.gate-box{width:100%;max-width:340px;text-align:center}
.gate-box h2{font-size:18px;margin:0 0 6px;color:#e8eaed}
.gate-box p{color:#8b95a5;font-size:13px;margin:0 0 18px}
.gate-box input{width:100%;background:#171a21;border:1px solid #2c3340;border-radius:10px;color:#e8eaed;
  padding:12px 14px;font:inherit;font-size:20px;text-align:center;letter-spacing:6px}
.gate-box button{width:100%;margin-top:12px;background:#3b82f6;border:0;color:#fff;padding:12px;border-radius:10px;
  font:inherit;font-weight:600;cursor:pointer}
.gate-box button:hover{background:#2f6fe0}
.gate-err{color:#ffb4b4;font-size:13px;margin-top:10px;min-height:18px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-box">
    <h2>🔒 请输入下载密码</h2>
    <p>密码每天更新 · 6 位数字<br>向管理员获取今天的密码</p>
    <input id="gatePw" type="tel" inputmode="numeric" maxlength="6" placeholder="今日密码" autofocus>
    <button id="gateBtn">进入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>
<div class="wrap">
  <header>
    <h1 id="site">软件下载</h1>
    <p class="subtitle" id="subtitle"></p>
    <p class="repo" id="repo"></p>
  </header>
  <main id="list"><div class="empty">加载中…</div></main>
  <footer>
    页面由 GitHub Pages 托管 · 文件存于 GitHub Releases<br>
    国内加速线路由第三方提供，可能不稳定；某条打不开请换其它线路或用「直接下载」。
  </footer>
</div>

<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function attr(s){return esc(s).replace(/"/g,'&quot;');}
function fmtSize(n){if(n==null)return'';var u=['B','KB','MB','GB'],i=0,v=Number(n);
  while(v>=1024&&i<u.length-1){v/=1024;i++;}return v.toFixed(v>=10||i===0?0:1)+' '+u[i];}
function fmtDate(s){if(!s)return'';try{var d=new Date(s);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}catch(e){return'';}}

// 极简 Markdown
function md(src){
  var lines=esc(src||'').split(/\r?\n/),html='',inList=false;
  function closeList(){if(inList){html+='</ul>';inList=false;}}
  for(var i=0;i<lines.length;i++){
    var ln=lines[i];
    if(/^\s*[-*]\s+/.test(ln)){if(!inList){html+='<ul>';inList=true;}html+='<li>'+inline(ln.replace(/^\s*[-*]\s+/,''))+'</li>';continue;}
    closeList();
    if(/^\s*#{2,3}\s+/.test(ln)){html+='<h3>'+inline(ln.replace(/^\s*#{2,3}\s+/,''))+'</h3>';continue;}
    if(/^\s*#{1}\s+/.test(ln)){html+='<h2>'+inline(ln.replace(/^\s*#\s+/,''))+'</h2>';continue;}
    if(/^\s*---+\s*$/.test(ln)){html+='<hr>';continue;}
    if(/^\s*$/.test(ln)){continue;}
    html+='<p style="margin:6px 0">'+inline(ln)+'</p>';
  }
  closeList();
  return html;
}
function inline(s){
  return s.replace(/`([^`]+)`/g,'<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
          .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}

// 依次触发多个文件下载（跨域，文件名用服务器原名）
function dlGroup(el){
  var urls=(el.getAttribute('data-urls')||'').split('|').filter(Boolean);
  urls.forEach(function(u,i){
    setTimeout(function(){
      var a=document.createElement('a');a.href=u;a.rel='noopener';
      document.body.appendChild(a);a.click();a.remove();
    },i*800);
  });
}

function fileBlock(f){
  var accel='';
  if(f.mirrors&&f.mirrors.length){
    accel='<details class="accel"><summary>⚡ 国内加速</summary><div class="accel-list">'+
      f.mirrors.map(function(m){return '<a class="btn btn-accel" href="'+attr(m.url)+'">'+esc(m.name)+'</a>';}).join('')+
      '</div></details>';
  }
  var dl=(f.downloadCount!=null)?(' · 已下载 '+f.downloadCount+' 次'):'';
  return '<div class="file"><div class="file-name">'+esc(f.name)+'</div>'+
    '<div class="file-meta">'+fmtSize(f.size)+dl+'</div>'+
    '<div class="btns"><a class="btn btn-main" href="'+attr(f.url)+'">⬇ 直接下载</a>'+accel+'</div></div>';
}

function categoryBlock(cat,files){
  if(!files.length)return'';
  var allBtn='';
  if(files.length>1){
    var urls=files.map(function(f){return f.url;}).join('|');
    allBtn='<span class="cat-all" data-urls="'+attr(urls)+'" onclick="event.preventDefault();event.stopPropagation();dlGroup(this)">⬇ 下载本类全部 ('+files.length+')</span>';
  }
  // 文件超过 6 个的分类默认折叠，点标题展开
  var open=(files.length<=6)?' open':'';
  return '<details class="cat'+(cat.bundle?' bundle':'')+'"'+open+'>'+
    '<summary>'+esc(cat.label)+' <span class="cat-count">'+files.length+' 个</span>'+allBtn+'</summary>'+
    '<div class="cat-files">'+files.map(fileBlock).join('')+'</div></details>';
}

function versionBlock(v,cats,isFirst){
  var badge='';
  if(isFirst&&!v.prerelease)badge='<span class="badge latest">最新</span>';
  if(v.prerelease)badge='<span class="badge pre">预览版</span>';

  var body=(v.body?'<div class="changelog">'+md(v.body)+'</div>':'');

  var filesHtml;
  if(!v.files||!v.files.length){
    filesHtml='<div class="file-meta" style="padding-top:12px">该版本暂无文件</div>';
  }else{
    var groups=cats.map(function(c){
      var fs=v.files.filter(function(f){return f.category===c.key;});
      return categoryBlock(c,fs);
    });
    filesHtml=groups.join('');
  }

  return '<section class="ver"><div class="ver-head">'+
    '<span class="ver-num">'+esc(v.title||v.version)+'</span>'+badge+
    '<span class="ver-date">'+fmtDate(v.date)+'</span></div>'+
    body+filesHtml+'</section>';
}

function loadData(){
  fetch('./data.json?_='+Date.now()).then(function(r){
    if(!r.ok)throw new Error('数据加载失败');return r.json();
  }).then(function(d){
    if(d.site)document.getElementById('site').textContent=d.site;
    document.title=d.site||'软件下载';
    document.getElementById('subtitle').textContent=d.subtitle||'';
    if(d.repo)document.getElementById('repo').textContent='项目：'+d.repo;
    var cats=d.categories&&d.categories.length?d.categories:[{key:'other',label:'文件',bundle:false}];
    var list=document.getElementById('list');
    // 优先用 tracks（独立版本线）；旧 data.json 没有 tracks 时退回单条扁平版本列表
    var tracks=(d.tracks&&d.tracks.length)?d.tracks
      :((d.versions&&d.versions.length)?[{key:'all',label:'',versions:d.versions}]:[]);
    if(!tracks.length){list.innerHTML='<div class="empty">还没有发布任何版本。</div>';return;}
    var SHOW_LIMIT=3; // 每条线默认只显示最新 3 个版本，其余点「显示全部」展开
    function renderTrack(tr){
      if(!tr.versions||!tr.versions.length)return'<div class="empty">该分类暂无版本。</div>';
      var blocks=tr.versions.map(function(v,i){return versionBlock(v,cats,i===0);});
      if(blocks.length<=SHOW_LIMIT)return blocks.join('');
      var rest=blocks.length-SHOW_LIMIT;
      return blocks.slice(0,SHOW_LIMIT).join('')+
        '<div class="more-rest hidden">'+blocks.slice(SHOW_LIMIT).join('')+'</div>'+
        '<button class="more-btn">▾ 显示全部 '+tr.versions.length+' 个版本（还有 '+rest+' 个旧版本）</button>';
    }
    // 委托点击：点「显示全部」展开剩余版本并移除按钮（Tab 切换后仍生效）
    list.addEventListener('click',function(e){
      var btn=e.target.closest&&e.target.closest('.more-btn');if(!btn)return;
      var box=btn.previousElementSibling;if(box)box.classList.remove('hidden');btn.remove();
    });
    if(tracks.length<=1){ list.innerHTML=renderTrack(tracks[0]); return; }
    // 多轨道 → 渲染 Tab 切换
    var tabsHtml='<div class="tabs">'+tracks.map(function(tr,i){
      return '<span class="tab'+(i===0?' active':'')+'" data-i="'+i+'">'+esc(tr.label)+'</span>';
    }).join('')+'</div>';
    list.innerHTML=tabsHtml+'<div id="trackPanel">'+renderTrack(tracks[0])+'</div>';
    var tabEls=list.querySelectorAll('.tab');
    tabEls.forEach(function(el){
      el.addEventListener('click',function(){
        tabEls.forEach(function(x){x.classList.remove('active');});
        el.classList.add('active');
        document.getElementById('trackPanel').innerHTML=renderTrack(tracks[+el.getAttribute('data-i')]);
      });
    });
  }).catch(function(e){
    document.getElementById('list').innerHTML='<div class="error">加载失败：'+esc(e.message)+'<br>请稍后刷新重试。</div>';
  });
}

// ===== 每日密码门禁（密码每天变，当天验证后记住）=====
var PASS_SEED='SY-8x2k9qZ-daily-7e1b';
function cyrb53(str){
  var h1=0xdeadbeef,h2=0x41c6ce57;
  for(var i=0,ch;i<str.length;i++){ch=str.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507);h1^=Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507);h2^=Math.imul(h1^(h1>>>13),3266489909);
  return 4294967296*(2097151&h2)+(h1>>>0);
}
function bjDateStr(){
  var now=new Date(); var u=new Date(now.getTime()+8*3600000);
  return ''+u.getUTCFullYear()+String(u.getUTCMonth()+1).padStart(2,'0')+String(u.getUTCDate()).padStart(2,'0');
}
function todayCode(){ return String(cyrb53(PASS_SEED+':'+bjDateStr())%1000000).padStart(6,'0'); }
function passGate(){ document.getElementById('gate').classList.add('hidden'); loadData(); }
(function(){
  var today=bjDateStr();
  if(localStorage.getItem('sy_pass_day')===today){ passGate(); return; }
  var inp=document.getElementById('gatePw'), btn=document.getElementById('gateBtn'), err=document.getElementById('gateErr');
  function tryPass(){
    var code=todayCode();
    if((inp.value||'').trim()===code){ localStorage.setItem('sy_pass_day', today); passGate(); }
    else { err.textContent='密码不对，请向管理员获取今天的密码'; inp.value=''; inp.focus(); }
  }
  btn.addEventListener('click', tryPass);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') tryPass(); });
})();
</script>
</body>
</html>
